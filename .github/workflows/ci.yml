name: Build and test

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: .NET 10 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      MEDICAL_BENCHMARK_OUTPUT: ${{ github.workspace }}/TestResults/benchmarks/directory.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MedicalBookingSystem/MedicalBookingSystem.sln
      - name: Build
        run: dotnet build MedicalBookingSystem/MedicalBookingSystem.sln --configuration Release --no-restore
      - name: Test and collect coverage
        run: dotnet test MedicalBookingSystem/MedicalBookingSystem.sln --configuration Release --no-build --no-restore --logger trx --results-directory TestResults --collect "XPlat Code Coverage" --settings coverage.runsettings
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Browser workflows / Ubuntu
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Build applications
        run: dotnet build MedicalBookingSystem/MedicalBookingSystem.sln --configuration Release
      - name: Install browser tests
        working-directory: tests/e2e
        run: npm ci
      - name: Install Chromium and Firefox
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium firefox
      - name: Run real browser workflows
        working-directory: tests/e2e
        run: npm test
      - name: Upload browser report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-workflows
          path: TestResults/e2e/
          if-no-files-found: ignore
          retention-days: 14

  containers:
    name: Containers / compose smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATIENT_HOST: patient.localhost
      API_HOST: api.localhost
      STAFF_HOST: staff.localhost
      COMPOSE: docker compose -f deploy/docker-compose.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create throwaway secrets
        run: sh deploy/scripts/create-secrets.sh
      - name: Build images
        run: $COMPOSE --profile tools build
      - name: Start the stack
        run: $COMPOSE up -d --wait --wait-timeout 180
      - name: Smoke test through Caddy
        run: sh deploy/scripts/smoke-test.sh "$PATIENT_HOST" "$API_HOST" "$STAFF_HOST"
      - name: Back up and verify with the maintenance image
        run: |
          mkdir -p deploy/backups && sudo chown 1654:1654 deploy/backups
          $COMPOSE run --rm maintenance backup /data/db/medical.db /data/photos /backups/ci
          $COMPOSE run --rm maintenance verify /backups/ci
      - name: Show container state and logs
        if: always()
        run: |
          $COMPOSE ps -a
          $COMPOSE logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v

  arm64-images:
    name: Containers / ARM64 build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build every target for linux/arm64 (Oracle Ampere)
        run: |
          for target in api staff maintenance web; do
            docker buildx build --platform linux/arm64 --target "$target" -f deploy/docker/Dockerfile .
          done
