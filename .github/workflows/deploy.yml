name: Deploy demo

# After a green "Build and test" on main: publish ARM64 images to GitHub Container Registry and, when the
# server secrets are configured, roll them out to the demo server over SSH (backup first, rollback on failure).
on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Publish images (linux/arm64)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      registry: ${{ steps.names.outputs.registry }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - id: names
        name: Registry name (GHCR needs lowercase)
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/medical-booking" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          for target in api staff web maintenance; do
            docker buildx build --platform linux/arm64 --target "$target" -f deploy/docker/Dockerfile \
              --tag "${{ steps.names.outputs.registry }}/$target:$SHA" --tag "${{ steps.names.outputs.registry }}/$target:latest" \
              --cache-from type=gha,scope=$target --cache-to type=gha,mode=max,scope=$target --push .
          done

  deploy:
    name: Roll out to the demo server
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Skip when the server is not configured
        id: target
        run: |
          if [ -z "$DEPLOY_HOST" ]; then echo "No DEPLOY_HOST secret - images are published, nothing to roll out."; echo "ready=false" >> "$GITHUB_OUTPUT";
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v6
        if: steps.target.outputs.ready == 'true'
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: Deploy over SSH
        if: steps.target.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            sh -s -- "$DEPLOY_PATH" "$SHA" "${{ needs.images.outputs.registry }}" < deploy/scripts/remote-deploy.sh
      - name: Public health check
        if: steps.target.outputs.ready == 'true' && vars.API_HOST != ''
        run: curl -fsS --retry 5 --retry-delay 10 "https://${{ vars.API_HOST }}/health/ready"
